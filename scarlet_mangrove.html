<script>
    (function() {
      var hash = window.location.hash;
      if (hash === '#mangrove' || hash === '#blackhole') {
        // This style will hide the bulb *before* it renders
        document.write('<style>#scene-bulb { opacity: 0 !important; }</style>');
      }
    })();
</script>
<style>
    :root{

        --on: 0;
        --bg-h: calc(200 - (var(--on) * 160));
        --bg-s: calc(20% + (var(--on) * 50%));
        --bg-l: calc(6% + (var(--on) * 40%));
    }
    *{box-sizing:border-box}

    body {
        font-family:"Montserrat", Manrope,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial;
        /* background:hsl(var(--bg-h), var(--bg-s), var(--bg-l)); */
        background: black;
        color:#ffffff;
        /* transition:background .35s ease; */
        overflow:hidden;
    }

    /* when the waterfall scene is active, unlock height so the deck can create real page scroll */
    body.mode-waterfall, 
    body.mode-waterfall html {
        height: auto;
    }

    /* --- Scene containers --- */
    .scene{
        position:fixed; inset:0;
        display:grid; place-items:center;
        opacity:1; pointer-events:auto;
        transition:opacity .5s ease;
    }
    .scene.is-hidden{opacity:0; pointer-events:none}

    #scene-water {
        position: static;     
        display: block;   
        inset: auto;
        height: auto;
        min-height: 100%;
        background:#0b1020;
    }

    /* Scene A layout */
    
    /* put the bulb scene’s content at the top of the viewport */
    #scene-bulb{
        place-items: start center;   /* overrides .scene's center/center */
    }

    /* make the room span the viewport height so top:0 is the top of the screen */
    #scene-bulb .room{
        width: 100%;
        min-height: 100vh;
    }

    .bulb-wrap, .room{
        position:relative;
        width:min(70vmin, 520px);
        height:70vmin;
        max-height:520px;
        display:flex;
        align-items:flex-start;
        justify-content:center;
    }

    /* Big warm vignette (centered slightly above middle) */
    .room::before{
        content:"";
        position:absolute; inset:-50vmax;   /* way larger than the room */
        background:
            radial-gradient(
            70vmin 70vmin at 50% 40%,
            rgba(235,209,164,0.18),
            rgba(235,209,164,0.10) 35%,
            rgba(0,0,0,0) 80%              /* fade to transparent, not black */
            );
        pointer-events:none;
        filter:none;                        /* avoid box-edge artifacts */

        /* display: none; */
        /* content:"";
        position:absolute; inset:-20vmin;
        background:
            radial-gradient(
            60vmin 60vmin at 50% 35%,
            rgba(235,209,164,0.15),
            rgba(235,209,164,0.02) 30%,
            rgba(235,209,164,0.02) 55%,
            rgba(0,0,0,0.75) 30%,
            rgba(0,0,0,1) 20%
            );
        pointer-events:none;
        filter: blur(2px); */
    }

    /* The small “zig” filament bulb (your second design) */
    .area{
        position: absolute;
        top: 0;          /* attach the wire’s top to the top of the viewport */
        left: 50%;
        transform: translateX(-50%);
        width:200px; height:500px;
        animation:swing 1.2s ease-in-out infinite alternate;
        transform-origin:top;
    }
    /* make the animation preserve the translate */
    @keyframes swing{
        from{ transform: translateX(-50%) rotate(3deg); }
        to  { transform: translateX(-50%) rotate(-3deg); }
    }

    .strip{ position:relative; width:18px; height:2px; right:1px; top:4px; background:darkgrey; }
    .strip:nth-of-type(2){ top:7px } .strip:nth-of-type(3){ top:10px }

    .wire,
    .fixture,
    .bulb {
        left: 50%;
        transform: translateX(-50%);       /* centers each piece on the page */
    }

    /* the rest stays the same: just remove the old left:98/92/80px */
    .wire {
        position: relative;
        height: clamp(180px, 40vh, 320px);
        width: 2px;
        background: #565151;
    }

    .fixture {
        position: relative;
        background: grey;
        width: 16px;
        height: 20px;
        margin-top: 0; /* optional: tighten join with wire */
    }

    .bulb {
        position: relative;
        width: 40px;
        height: 40px;
        bottom: 2px;
        border-radius: 50%;
        background: rgba(226,211,161,.15);
        box-shadow: 0 0 0 0 transparent;
        transition: background .25s ease, box-shadow .25s ease;
    }

    /* the vignette, centered on the bulb itself */
    .bulb::after{
        content:"";
        position:absolute;
        left:50%; top:50%;
        transform:translate(-50%,-50%);
        width:200vmax;                 /* bigger than any screen dimension */
        height:200vmax;
        pointer-events:none;
        /* don't blur the element's box; let the gradient do the softness */
        filter:none;
        opacity:0;
        background:
            radial-gradient(
            60vmin 60vmin at 50% 50%,
            rgba(235,209,164,0.35) 0%,
            rgba(235,209,164,0.22) 30%,
            rgba(235,209,164,0.08) 55%,
            rgba(0,0,0,0) 75%          /* transparent at the edge */
            );
        z-index:-1;            /* behind the bulb */
    }

    .bulb.on{
        background:rgba(226,211,161,.85);
        box-shadow:0 0 300px 77px rgba(235,209,164,1);
    }
    .bulb.on::after{ opacity: 1; }


    .zig{
        position:relative; background:transparent; width:10px; height:5px;
        border-radius:5px / 2.5px; left:14px; border:#000 solid 1px;
    }
    .zig:nth-of-type(2){ top:-3px } .zig:nth-of-type(3){ top:-6px }

    /* Flick switch (bottom center) */
    .flick{
        position:absolute; left:50%; bottom:10%; transform:translateX(-50%);
        display:flex; align-items:center; gap:.8rem;
    }
    .flick input{ position:absolute; opacity:0; pointer-events:none; }
    .flick .rocker{
        width:74px; height:40px; border-radius:999px; background:#222;
        border:1px solid rgba(255,255,255,.15);
        position:relative;
        box-shadow:inset 0 0 8px rgba(0,0,0,.6);
        transition:background .25s,border-color .25s,box-shadow .25s;
    }
    .flick .knob{
        position:absolute; top:3px; left:37px; /* start ON (right) */
        width:34px; height:34px; border-radius:50%; background:#ffe38a;
        box-shadow:0 2px 6px rgba(0,0,0,.35), inset 0 -1px 0 rgba(255,255,255,.2);
        transition:left .25s cubic-bezier(.3,1.3,.4,1), background .25s;
    }
    .flick input:not(:checked) ~ .rocker .knob{ left:3px; background:#555; }
    .flick input:not(:checked) ~ .rocker{
        background:#222; border-color:rgba(255,255,255,.15); box-shadow:inset 0 0 8px rgba(0,0,0,.6);
    }
    .flick input:checked ~ .rocker{
        background:#433; border-color:rgba(255,235,0,.45);
        box-shadow:inset 0 0 16px rgba(255,235,0,.25);
    }
    .flick .label{
        font:600 14px/1.2 "Montserrat", Manrope, system-ui, Segoe UI, Roboto, Arial;
        color:hsl(0 0% 75% / .9);
    }
    
    /* @keyframes jelloWobble {
        0%   { transform: translate(-50%, -50%) scale(1,1) }
        15%  { transform: translate(-50%, -50%) scale(1.25,0.75) }
        30%  { transform: translate(-50%, -50%) scale(0.75,1.25) }
        45%  { transform: translate(-50%, -50%) scale(1.15,0.85) }
        60%  { transform: translate(-50%, -50%) scale(0.95,1.05) }
        75%  { transform: translate(-50%, -50%) scale(1.05,0.95) }
        100% { transform: translate(-50%, -50%) scale(1,1) }
    } */
    /* .knob.jello {
    animation: jelloWobble 1.1s cubic-bezier(.23,1,.32,1);
    } */

    .hint{ position:absolute; bottom:10%; width:100%; text-align:center; opacity:.7; font-size:.95rem }

    /* wiggle feedback */
    @keyframes wiggle { 0%{transform:translate(-50%,-50%) rotate(0)} 25%{transform:translate(-50%,-50%) rotate(2deg)} 50%{transform:translate(-50%,-50%) rotate(-2deg)} 100%{transform:translate(-50%,-50%) rotate(0)} }
    .bulb.wiggle{ animation:wiggle .25s ease }

    /* --- Black hole scene (your canvas + ENTER) --- */
    #blackhole {
        height:100%; width:100%;
        position:relative; display:flex;
        background: rgb(0,0,0); 
    }
    .centerHover{
        width:255px; height:255px; border-radius:50%;
        position:absolute; left:50%; top:50%;
        margin:-128px 0 0 -128px;
        z-index:2; cursor:pointer;
        line-height:255px; text-align:center;
        transition:all 500ms;
    }
    .centerHover.open{ opacity:0; pointer-events:none }
    .centerHover span{
        color:#666; font-family: "Montserrat", Manrope, serif; font-size:18px; position:relative; transition:all 500ms;
    }
    .centerHover span:before,
    .centerHover span:after{
        content:''; display:inline-block; height:1px; width:16px;
        margin:0 12px 4px; background:#666; transition:all 500ms;
    }
    .centerHover:hover span{ color:#ddd }
    .centerHover:hover span:before,
    .centerHover:hover span:after{ background:#ddd }

    canvas{ position:relative; z-index:1; width:100%; height:100%; margin:auto }

    /* --- Floating mini toggle (keep a way back) --- */
    .mini-toggle{
        position:fixed; left:16px; bottom:16px; z-index:9999;
        display:inline-flex; align-items:center; gap:.5rem;
        background:rgba(20,20,20,.7); color:#ffd166;
        border:1px solid rgba(255,255,255,.12);
        border-radius:999px; padding:.5rem .9rem; cursor:pointer;
        backdrop-filter: blur(6px);
        transition:transform .2s ease, opacity .2s ease;
    }
    .mini-toggle:hover{ transform:translateY(-2px) }
    .mini-toggle svg{ width:18px; height:18px }

    figure{

    }

    }
    figure.in{ opacity:1 }

    figure.right{ float:right }

    figure.right figcaption{ border-left:2px solid #fff; text-align:left }

    figure.left{ float:left }
    figure.left canvas{ right:0 }
    figure.left figcaption{ border-right:2px solid #fff; text-align:right }

    figcaption{
        position:relative;
        padding:0 10px;
        z-index:1;
        text-transform:uppercase;
        font-family: "Montserrat", Manrope, sans-serif;
        font-size:1.3rem;
        opacity:0;
        transition:opacity 1s;
    }
    figcaption p{ line-height:1.5 }

    .section{ width:100vw; height:100vh }

    #title{ margin:auto }

    #scroll-btn{
        position:fixed; bottom:0; left:50%;
        margin-left:-54px; opacity:1;
        transform:translateZ(0);
        transition:opacity .2s;
    }
    #scroll-btn.out{ opacity:0 }

    #ground{
        position:fixed;
        top:0; left:0; width:100%; height:100%;
        display:block;
        pointer-events:none; 
        z-index:0;
    }

    #deck { 
        position:relative; 
        z-index:10;
    }

    #deck h2, #deck h3 {
        text-shadow: 0 2px 8px rgba(0,0,0,.4);
    }

    /* Keyframe for the orb's spinning ring */
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    /* --- Scroll Nudge Arrow --- */
    #scroll-arrow {
        position: absolute;
        bottom: 30px; /* Position it at the bottom of the screen */
        left: 50%;
        transform: translateX(-50%);
        opacity: 0;
        pointer-events: none; /* So it can't be clicked */
        animation: bounce 2s ease-in-out infinite;
        transition: opacity 0.3s ease;
    }

    #scroll-arrow.is-visible {
        opacity: 0.7; /* This will fade it in */
    }

    #scroll-arrow.is-hidden {
        opacity: 0;
        pointer-events: none;
    }

    /* Bouncing animation keyframes */
    @keyframes bounce {
        0%, 20%, 50%, 80%, 100% {
            transform: translate(-50%, 0);
        }
        40% {
            transform: translate(-50%, -15px); /* Move up */
        }
        60% {
            transform: translate(-50%, -8px); 
        }
    }

    #frog-link {
        position: fixed;
        bottom: 20px; /* Adjust as needed */
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        
        /* Control visibility */
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
    }

    #frog-link img {
        width: 160px; /* Set the size of your frog */
        height: auto;
        display: block;
    }

    /* This class will be removed by JS when at the bottom */
    #frog-link.is-hidden {
        opacity: 0;
        pointer-events: none;
    }

    /* This class will be added by JS */
    #frog-link.is-visible {
        opacity: 1;
        pointer-events: auto;
        cursor: pointer;
    }

    /* reduces motion? keep fades only */
    @media (prefers-reduced-motion: reduce){
        .scene{ transition:none }
        .bulb.wiggle{ animation:none }
        #scroll-arrow { animation: none }
    }

    <!-- Scene C: Waterfall (hidden initially) -->
    <section id="scene-water" class="scene is-hidden" aria-hidden="true">
        <script id="skyVS" type="x-shader/x-vertex">
            varying vec2 vUv;
            varying float time;
            uniform float delta;
          
            void main()
            {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix *  vec4(position,1.0);
            }
        </script>

        <script id="skyFS" type="x-shader/x-fragment">
            #ifdef GL_ES
            precision highp float;
            #endif
            
            uniform vec2  resolution;
            uniform float time;
            uniform float delta;
            
            varying vec2 vUv;
            
            void main(void)
            {
                float y = vUv.y; // 0.0 at bottom (horizon), 1.0 at top
                
                // 1. Define the 3 colors for the gradient
                // A subtle dark red/purple for the horizon
                vec3 colorSunset = vec3(0.35, 0.1, 0.15); 
                // A dark, rich blue for the mid-sky
                vec3 colorDarkBlue = vec3(0.1, 0.05, 0.25); 
                // An almost-black blue for the top
                vec3 colorBlack = vec3(0.0, 0.0, 0.05);     
                
                // 2. Create the two gradient halves
                // Blend from Sunset to Dark Blue (from y=0.0 to y=0.4)
                float t_bottom = smoothstep(0.0, 0.8, y);
                vec3 bottomHalf = mix(colorSunset, colorDarkBlue, t_bottom);
                
                // Blend from Dark Blue to Black (from y=0.4 to y=0.9)
                float t_top = smoothstep(0.8, 0.9, y);
                vec3 topHalf = mix(colorDarkBlue, colorBlack, t_top);
                
                // 3. Combine the two halves
                vec3 col = mix(bottomHalf, topHalf, t_top);
                
                // 4. (This is your original code) Add the subtle wiggles back in
                if (y < 0.85) {
                    float wiggle = 0.6 + 0.4 * sin(delta * 0.3 + vUv.x * 2.0);
                    float add    = (0.85 - y) * 0.12 * wiggle;
                    col += vec3(add * 0.6, add * 0.1, add);
                }
                if (y < 0.80) {
                    col += vec3(0.0, 0.00, 0.015) * cos(vUv.x * 3.0 + delta * 0.2);
                }
                
                gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
            }
            
        </script>

        <script id="mangroveWaterVS" type="x-shader/x-vertex">
            varying vec2 vUv;
            uniform float uTime;
            void main() {
                vUv = uv * 8.0;   // tile UVs (8x) for ripples
                vec3 pos = position;
                // Calmer, slower ripples
                pos.z += sin((pos.x + uTime*0.1)*0.12)*0.6;
                pos.z += cos((pos.y + uTime*0.08)*0.1)*0.5;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.0);
            }
        </script>
          
        <script id="mangroveWaterFS" type="x-shader/x-fragment">
            #ifdef GL_ES
            precision highp float;
            #endif
            varying vec2 vUv;
            uniform float uTime;
            
            float hash(vec2 p){ return fract(sin(dot(p, vec2(23.43, 45.17))) * 125413.33); }
            float noise(vec2 p){
              vec2 i = floor(p), f = fract(p);
              float a = hash(i);
              float b = hash(i + vec2(1.0,0.0));
              float c = hash(i + vec2(0.0,1.0));
              float d = hash(i + vec2(1.0,1.0));
              vec2  u = f*f*(3.0-2.0*f);
              return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
            }
            
            void main(){
              // more saturated teal
              // vec3 shallow = vec3(0.05, 0.66, 0.60);
              // vec3 deep    = vec3(0.04, 0.28, 0.36);

                // Murky mangrove green
                vec3 shallow = vec3(0.05, 0.15, 0.20); 
                vec3 deep    = vec3(0.01, 0.05, 0.08); 
            
                float g = smoothstep(0.18, 0.86, vUv.y);
                vec3 col = mix(shallow, deep, g);
                
                float c1 = noise(vUv*2.2 + uTime*0.10);
                float c2 = noise(vUv*3.7 + uTime*0.18);
                float caustics = pow(max(0.0, c1*0.6 + c2*0.4 - 0.45), 2.0) * 1.1;
                
                // fake fresnel: brighter at glancing angles (near top of plane)
                float fres = smoothstep(0.65, 1.0, vUv.y);
                col += vec3(0.30, 0.36, 0.42) * caustics;
                col += vec3(0.18, 0.22, 0.25) * fres;
                
                gl_FragColor = vec4(col, 0.4);
            }            
        </script>

function setRendererDPR(renderer, dpr, cssW, cssH) {
  renderer.setSize(cssW * dpr, cssH * dpr, false);

  renderer.domElement.style.height = cssH + 'px';

    const sceneWater = document.getElementById('scene-water');

    const clickSfx = new Audio('https://assets.codepen.io/605876/click.mp3');

    const root = document.documentElement;
    const bulb = document.getElementById('bulbGlass');
    const input = document.getElementById('switchInput');

    // Start ON
    function setOn(on){
        root.style.setProperty('--on', on ? 1 : 0);
        bulb.classList.toggle('on', on);
        input.checked = !!on;
    }

    setOn(true);

    function switchToHole(){
        sceneBulb.classList.add('is-hidden');
        sceneHole.classList.remove('is-hidden');
        sceneHole.setAttribute('aria-hidden','false');
        if (!window.__blackholeInit) { window.__blackholeInit = true; startBlackHole(); }
        window.location.hash = 'blackhole';
    }

    function switchToBulb(){
        setOn(true);
        sceneHole.classList.add('is-hidden');
        sceneBulb.classList.remove('is-hidden');
        sceneHole.setAttribute('aria-hidden','true');
        window.location.hash = '';
    }

    //  The waterfall scene
    // helper: show Scene C (waterfall)
    function switchToWater() {
        if (!window.__waterfallInit) {
            window.__waterfallInit = true;
            initWaterfall();
            startWaterfallLoop();
        }

        sceneBulb.classList.add('is-hidden');
        sceneHole.classList.add('is-hidden');
        sceneWater.classList.remove('is-hidden');
        document.body.classList.add('mode-waterfall');

        window.location.hash = 'mangrove';

        // unlock scroll
        document.documentElement.style.overflowY = 'auto';
        document.body.style.overflowY = 'auto';

        // reset scroll then compute after layout
        requestAnimationFrame(() => {
            document.documentElement.scrollTop = 0;
            document.body.scrollTop = 0;
            // This moves the user's focus to the new content
            document.querySelector("#cover h2").focus({ preventScroll: true });
            requestAnimationFrame(() => {
                computeMaxScroll();
                __bg && __bg.render();
            });
        });

        window.addEventListener('resize', () => {
            computeMaxScroll();
            __bg && __bg.resize();
        }, { passive:true });
    }

    // Switch behavior: OFF → dim then go to hole
    input.addEventListener('change', e => {
        clickSfx.currentTime = 0; clickSfx.play().catch(()=>{});
        if (e.target.checked){
        setOn(true);   // back on, stay here
        } else {
        setOn(false);  // quick dim
        setTimeout(switchToHole, 250);
        }
    });

    mini.addEventListener('click', ()=>{
        if (sceneBulb.classList.contains('is-hidden')) {
        switchToBulb();

        setOn(false);
        setTimeout(switchToHole, 200);
        }
    });

    // Expose for other code that might call them
    window.switchToHole = switchToHole;
    window.switchToBulb = switchToBulb;
    window.switchToWater = switchToWater;

    window.addEventListener("DOMContentLoaded", () => {

        if (currentHash === "#mangrove") {

    });

function blackhole(element) {
    const container = document.querySelector(element);
    const h = container.offsetHeight;
    const w = container.offsetWidth;
    const cw = w, ch = h;
    const maxorbit = 255;
    const centery = ch / 2;
    const centerx = cw / 2;

    const startTime = new Date().getTime();
    let currentTime = 0;

    const stars = [];
    let collapse = false, expanse = false, returning = false;

    const canvas = document.createElement('canvas');
    canvas.width = cw; canvas.height = ch;
    container.appendChild(canvas);
    const context = canvas.getContext("2d");
    context.globalCompositeOperation = "multiply";

    function setDPI(canvas, dpi) {
        if (!canvas.style.width) canvas.style.width = canvas.width + 'px';
        if (!canvas.style.height) canvas.style.height = canvas.height + 'px';
        const scaleFactor = dpi / 96;
        canvas.width = Math.ceil(canvas.width * scaleFactor);
        canvas.height = Math.ceil(canvas.height * scaleFactor);
        const ctx = canvas.getContext('2d');
        ctx.scale(scaleFactor, scaleFactor);
    }

    function rotate(cx, cy, x, y, angle) {
        const cos = Math.cos(angle), sin = Math.sin(angle);
        const nx = (cos * (x - cx)) + (sin * (y - cy)) + cx;
        const ny = (cos * (y - cy)) - (sin * (x - cx)) + cy;
        return [nx, ny];
    }

    setDPI(canvas, 192);

    class Star {
        constructor() {
            const rands = [];
            rands.push(Math.random() * (maxorbit / 2) + 1);
            rands.push(Math.random() * (maxorbit / 2) + maxorbit);
            this.orbital = (rands.reduce((p, c) => p + c, 0) / rands.length);

            this.x = centerx;
            this.y = centery + this.orbital;
            this.yOrigin = centery + this.orbital;

            this.speed = (Math.floor(Math.random() * 2.5) + 1.5) * Math.PI / 180;
            this.rotation = 0;
            this.startRotation = (Math.floor(Math.random() * 360) + 1) * Math.PI / 180;

            this.id = stars.length;

            this.collapseBonus = this.orbital - (maxorbit * 0.7);
            if (this.collapseBonus < 0) this.collapseBonus = 0;

            this.color = 'rgba(255,255,255,' + (1 - ((this.orbital) / 255)) + ')';
            this.hoverPos = centery + (maxorbit / 2) + this.collapseBonus;
            this.expansePos = centery + (this.id % 100) * -10 + (Math.floor(Math.random() * 20) + 1);

            this.prevR = this.startRotation;
            this.prevX = this.x;
            this.prevY = this.y;

            this.originalY = this.yOrigin;
            stars.push(this);
        }
        draw() {
            if (!expanse && !returning) {
                this.rotation = this.startRotation + (currentTime * this.speed);
                if (!collapse) {
                    if (this.y > this.yOrigin) this.y -= 2.5;
                    if (this.y < this.yOrigin - 4) this.y += (this.yOrigin - this.y) / 10;
                } else {
                    if (this.y > this.hoverPos) this.y -= (this.hoverPos - this.y) / -5;
                    if (this.y < this.hoverPos - 4) this.y += 2.5;
                }
            } else if (expanse && !returning) {
                this.rotation = this.startRotation + (currentTime * (this.speed / 2));
                if (this.y > this.expansePos) this.y -= Math.floor(this.expansePos - this.y) / -80;
            } else if (returning) {
                this.rotation = this.startRotation + (currentTime * this.speed);
                if (Math.abs(this.y - this.originalY) > 2) {
                    this.y += (this.originalY - this.y) / 50;
                } else {
                    this.y = this.originalY;
                    this.yOrigin = this.originalY;
                }
            }

            context.save();
            context.fillStyle = this.color;
            context.strokeStyle = this.color;
            context.beginPath();
            const oldPos = rotate(centerx, centery, this.prevX, this.prevY, -this.prevR);
            context.moveTo(oldPos[0], oldPos[1]);
            context.translate(centerx, centery);
            context.rotate(this.rotation);
            context.translate(-centerx, -centery);
            context.lineTo(this.x, this.y);
            context.stroke();
            context.restore();

            this.prevR = this.rotation;
            this.prevX = this.x;
            this.prevY = this.y;
        }
    }

    const centerHover = document.querySelector('.centerHover');

    centerHover.addEventListener('click', function() {
        collapse = false; expanse = true; returning = false;
        this.classList.add('open');

        // Let the black-hole animation play briefly, then go Waterfall
        setTimeout(() => {
            switchToWater();              // <-- crossfade to waterfall scene
        }, 2500); // 2.5s feels right; adjust between 2000-3000ms to taste

        // After expansion, begin return; then reset ENTER
        setTimeout(() => {
            expanse = false; returning = true;
            setTimeout(() => {
                returning = false;
                this.classList.remove('open');
            }, 8000);
        }, 25000);
    });

    centerHover.addEventListener('mouseover', function() {
        if (expanse === false) collapse = true;
    });
    centerHover.addEventListener('mouseout', function() {
        if (expanse === false) collapse = false;
    });

    function loop() {
        const now = new Date().getTime();
        currentTime = (now - startTime) / 50;
        context.fillStyle = 'rgba(0,0,0,0.2)';
        context.fillRect(0, 0, cw, ch);

        for (let i = 0; i < stars.length; i++) {
            if (stars[i]) stars[i].draw();
        }
        requestAnimationFrame(loop);
    }

    function init() {
        context.fillStyle = 'rgba(0,0,0,1)';
        context.fillRect(0, 0, cw, ch);
        for (let i = 0; i < 1200; i++) new Star();
        loop();
    }
    init();
}

        /* POLYGON */
        var POL = function (vertices, obj) {
                var comma,
                    i;
                    
                if (vertices instanceof Array === true) {
                    this.vertices = vertices;
                } else if (typeof(vertices) == 'string') {
                    comma = vertices.indexOf(' ') > vertices.indexOf(',') ? false : true; //determine if comma or space delimeted

                    if (comma) {
                        this.vertices = vertices.split(',');
                        for (i = 0; i < this.vertices.length; i += 1) {
                            this.vertices[i] = this.vertices[i].split(' ');
                        }
                    } else {
                        this.vertices = vertices.split(' ');
                        for (i = 0; i < this.vertices.length; i += 1) {
                            this.vertices[i] = this.vertices[i].split(',');
                        }
                    }
                }
            };
            
            POL.prototype.setContext = function (ctx) {
                this.ctx = ctx;
            };

            POL.prototype.setClip = function (clipTarget) {
                this.clipTarget = clipTarget;
            };
            
            POL.prototype.getVertices = function () {
                return this.vertices;
            };
            
            /**
            * create canvas polygon out of vertices
            */
            POL.prototype.canvasPolygon = function (vertices) {
                var i,
                    vertices = vertices ? vertices : this.vertices;

                if (this.ctx) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(vertices[0][0], vertices[0][1]);

                    for (i = 1; i < vertices.length; i += 1) {
                        this.ctx.lineTo(vertices[i][0], vertices[i][1]);
                    }

                    this.ctx.closePath();
                }
            };

            /**
            * create clip path out of vertices
            */
            POL.prototype.clipPolygon = function (vertices) {
                var i,
                    clipString,
                    vertices = vertices ? vertices : this.vertices;

                if (this.clipTarget) {
                    clipString = "polygon(";

                    for (i = 0; i < vertices.length; i += 1) {
                        clipString += vertices[i][0] + "px " + vertices[i][1] + 'px';

                        if (i < vertices.length - 1) {
                            clipString += ", ";
                        }
                    }

                    clipString += ")";
                    this.clipTarget.style.webkitClipPath = clipString;
                }
            };

        // ---------- Mangrove clump (trunk + prop roots + canopy billboards) ----------
        function createMangroveClump() {
            var group = new THREE.Object3D();

            // trunk
            var trunkMat = new THREE.MeshLambertMaterial({ color: 0x4a3a2a, shading: THREE.FlatShading });

            var trunkGeo = new THREE.CylinderGeometry( 16, 24, 350, 6, 1, false );
            var trunkMat = new THREE.MeshLambertMaterial({ color: 0x5b4a32, shading: THREE.FlatShading });
            var trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 175;
            // trunk.castShadow = true;
            trunk.castShadow = false;
            group.add(trunk);

            // prop roots (4–6 legs)
            var rootMat  = new THREE.MeshLambertMaterial({ color: 0x3e2f23, shading: THREE.FlatShading });
            var rootGeo = new THREE.CylinderGeometry( 12, 24, 300, 5, 1, false );
            var roots = 4 + Math.floor(Math.random()*3);
            for (var i=0;i<roots;i++) {
                var r = new THREE.Mesh(rootGeo, rootMat);
                // r.castShadow = true;
                r.castShadow = false;
                var a = (Math.PI*2) * (i/roots) + Math.random()*0.3;
                var radius = 40 + Math.random()*30;
                r.position.set(Math.cos(a)*radius, 90, Math.sin(a)*radius);
                r.rotation.z = (Math.random() < 0.5 ? 1 : -1) * (0.8 + Math.random()*0.25); // lean outwards
                group.add(r);
            }

            // canopy (simple crossed billboards)
            var leafMat = new THREE.MeshLambertMaterial({
                // old: 0x2e6a3b
                color: 0x103015,           // darker, richer green
                transparent: true,
                opacity: 0.95,
                shading: THREE.FlatShading
            });

            // tiny random tint per canopy
            var t = 0.9 + Math.random() * 0.2;         // 0.9–1.1
            leafMat.color.offsetHSL(0, 0.05*(Math.random()*2-1), -0.03); // tiny sat/value wiggle
            leafMat.color.multiplyScalar(t);

            var leafGeo = new THREE.SphereGeometry( 110 + Math.random()*40, 5, 4 );
            var canopy = new THREE.Mesh(leafGeo, leafMat);
            canopy.position.y = 350;
            // canopy.castShadow = true;
            canopy.castShadow = false;
            group.add(canopy);
            

            return group;
        }

                // 3. Set bird's position and flight data
                bird.position.set(
                    -9000 + Math.random() * 18000,
                    instance.worldCenter.y + 4800 + Math.random() * 800,
                    -4200 + Math.random() * 800
                );

                bird.userData = {
                    dir: (Math.random() < 0.5 ? 1 : -1),
                    speed: 70 + Math.random() * 60,
                    amp: 10 + Math.random() * 12,     // Bobbing amount
                    phase: Math.random() * Math.PI * 2, // Bobbing phase
                    flapSpeed: 0.2 + Math.random() * 0.15, // Flap speed
                    flapPhase: Math.random() * Math.PI * 2, // Flap phase
                    wings: [wingL, wingR] // Store wings for animation
                };
                bird.rotation.y = (bird.userData.dir > 0 ? 0 : Math.PI);

                flock.add(bird);
                instance.birds.push(bird);
            }
            instance.scene.add(flock);
        }

        function addMoon() {
            var geo = new THREE.CircleGeometry(400, 32); // 400-unit radius
            var mat = new THREE.MeshBasicMaterial({ 
                color: 0xFFFEE5, // A soft, pale yellow-white
                transparent: true, 
                opacity: 0.9 
            });
            instance.moon = new THREE.Mesh(geo, mat);

            // Position it high up, far left, and just in front of the sky plane
            instance.moon.position.set(-3000, instance.worldCenter.y + 5400, -4900);
            instance.scene.add(instance.moon);
        }

        function addStars(count, size) {
            var geo = new THREE.Geometry();

            for (var i = 0; i < count; i++) {
                var v = new THREE.Vector3(
                THREE.Math.randFloatSpread(100000), // Very wide spread
                instance.worldCenter.y + THREE.Math.randFloat(5000, 8000), // High in the sky
                THREE.Math.randFloat(-4500, -8900), // Between trees and sky
                );
                geo.vertices.push(v);
            }

            var mat = new THREE.ParticleBasicMaterial({
                color: 0xffffff,
                size: size,
                sizeAttenuation: true,
                transparent: true,
                opacity: 0.8,
                fog: false,
            });

            var stars = new THREE.ParticleSystem(geo, mat);
            instance.stars.push(stars); // <-- Add this new system to our array
            instance.scene.add(stars);
        }

        function modelsLoaded() {

            instance.renderer = new THREE.WebGLRenderer({
                canvas: document.getElementById('ground'),
                antialias: true,             
                powerPreference: 'high-performance'
            });

            // push DPR a bit (clamped for safety)
            var dpr = Math.min(2, window.devicePixelRatio || 1);
            setRendererDPR(instance.renderer, dpr, window.innerWidth, window.innerHeight);

            instance.renderer.setClearColor(0x12021f, 1);

            // r61 still has these:
            instance.renderer.gammaInput  = true;
            instance.renderer.gammaOutput = true;
        
            instance.scene = new THREE.Scene();
            instance.scene.fog = new THREE.Fog(0x2a3c49, 2600, 8000);
            // --- Store original fog settings ---
            instance.originalFogColor = instance.scene.fog.color.clone();
            instance.originalFogNear = instance.scene.fog.near;
            instance.originalFogFar = instance.scene.fog.far;

            // instance.scene.add(new THREE.AmbientLight(0x000000)); // darker baseline
            instance.scene.add(new THREE.AmbientLight(0x000000)); // darker baseline

            var hemi = new THREE.HemisphereLight(0x4a3a8a, 0x1b3a34, 0.6); // (sky, ground, intensity)
            hemi.position.set(0, 5000, 0);
            instance.scene.add(hemi);
            
            instance.hemiLight = hemi; // Keep a reference to the light
            instance.originalHemiIntensity = hemi.intensity;


            // key light with soft shadows
            instance.spotLight = new THREE.SpotLight(0xffe2b0, 1.25, 10000, Math.PI/6, 0.45, 1.0);
            instance.spotLight.position.set(window.innerWidth * 0.35, 1200, 1400);
            instance.spotLight.castShadow = true;                 // turn on
            instance.spotLight.shadowMapWidth  = 1024;
            instance.spotLight.shadowMapHeight = 1024;
            instance.spotLight.shadowCameraNear = 200;
            instance.spotLight.shadowCameraFar  = 10000;
            instance.scene.add(instance.spotLight);

            instance.renderer.shadowMapEnabled = true;            // global switch
            instance.renderer.shadowMapSoft = true;
            
            instance.projector = new THREE.Projector();
            instance.mouse = new THREE.Vector2();
            instance.scrollArrow = document.getElementById('scroll-arrow');
            instance.frogLink = document.getElementById('frog-link');

            addBg();
            addSky();
            addStars(800, 15); // 800 small stars
            addStars(600, 25); // 600 medium stars
            addStars(400, 35); // 400 large stars
            // addMoon();

            addBanks();              // low sandy border
            addIslet();              // << new: raised island in the middle
            addLagoon();             // water around
            addMangroveForest();     // trees along the island rim
            addFireflies();
            addBirds();              // red birds in the sky
            addMangroveRoots(75); // Generate 75 roots
            addCritters();

            if (instance.terrain) instance.terrain.visible = false; // hide old base

            // instance.spotLight = new THREE.SpotLight(0xfff0d0, 2.2, 10000);
            // instance.spotLight.position.set(window.innerWidth*0.4, 400, 1200);
            
            instance.camera = new THREE.PerspectiveCamera(35, width / height, 2, 10000);
            instance.camera.position.set(0, 850, 2000 );
            instance.camera.rotation.set(0 * Math.PI / 180, 0, 0);

            // draw a guaranteed first frame
            instance.renderer.render(instance.scene, instance.camera);
            requestAnimationFrame(() => instance.renderer.render(instance.scene, instance.camera));
        };
        
        function loadModels() {
            var i = 0,
                        loader,
                data,
                        loaded = 0;
                            
            function parseModels(d) {
                models[loaded].geometry = d.geometry;
                        models[loaded].materials = d.material || d.materials;
                        loaded += 1;
                if (loaded == models.length) {
                            modelsLoaded();
                        } else {
                            loader = new THREE.JSONLoader();
                    data = loader.parse(models[loaded].json);
                    parseModels(data);
                        }
            };
                
            loader = new THREE.JSONLoader();
            data = loader.parse(models[loaded].json);
            parseModels(data);
        };

        // const deckEl = document.getElementById('deck');
        // let __maxScroll = 1;

        // function computeMaxScroll(){
        //     const h = (deckEl?.scrollHeight || document.body.scrollHeight || document.documentElement.scrollHeight);
        //     __maxScroll = Math.max(1, h - window.innerHeight);
        // }

        // function getScrollPercentDeck(){
        //     const y = window.scrollY || window.pageYOffset || 0;
        //     return Math.min(1, Math.max(0, y / __maxScroll));
        // }

        instance.render = function () {

            // animate water shader
            if (instance.waterUniforms) {
                instance.waterUniforms.uTime.value = (Date.now() % 100000) / 1000.0;
            }

            const p = getScrollPercentDeck();           // 0..1 scroll progress

            // --- DYNAMIC CAMERA Y-POSITION (UNDERWATER) ---
            // 1. Calculate the water's Y position (which depends on screen width)
            const lagoonY = instance.worldCenter.y + 3300;
            
            // 2. Define camera start and end Y positions
            const startY = 1700; // Start high up
            const endY = lagoonY - 200; // End 200 units *BELOW* the water
            
            // 3. Calculate the total distance for the camera to travel
            const totalYTravel = endY - startY; // This will be a negative number


            // 4. Calculate the camera's TARGET Y position based on scroll
            const targetRiverY = startY + totalYTravel * p; // --- END CAMERA PATH ---
            // --- (Your underwater fog/light code stays here) ---
            const waterLevel = instance.worldCenter.y + 3300;
            const underwaterFogColor = new THREE.Color(0x010A10);
            if (instance.cameraCurrentY < waterLevel) {
                // Check smoothed position
                // --- WE ARE UNDERWATER ---
                let depth = (waterLevel - instance.cameraCurrentY) / 200.0;
                depth = Math.min(1.0, depth);
                instance.scene.fog.color.copy(instance.originalFogColor);
                instance.scene.fog.color.lerp(underwaterFogColor, depth);
                instance.scene.fog.near = 100;
                instance.scene.fog.far = 6000;
                instance.hemiLight.intensity = instance.originalHemiIntensity * (1.0 - depth * 0.7);
            } else {
                // --- WE ARE ABOVE WATER ---
                instance.scene.fog.color.copy(instance.originalFogColor);
                instance.scene.fog.near = instance.originalFogNear;
                instance.scene.fog.far = instance.originalFogFar;
                instance.hemiLight.intensity = instance.originalHemiIntensity;
            } // --- END FOG/LIGHT EFFECT ---
            // --- SMOOTH CAMERA MOVEMENT ---
            // 1. Calculate TARGET positions
            const targetSway = Math.sin(p * Math.PI * 2.0) * 220;
            const targetDollyZ = 2300 - p * 3000; // 2. Define smoothness factor (0.1 = fast, 0.01 = very slow)
            const smoothness = 0.05; // 3. Interpolate (lerp) the CURRENT position toward the TARGET
            instance.cameraCurrentX += (targetSway - instance.cameraCurrentX) * smoothness;
            instance.cameraCurrentY += (targetRiverY - instance.cameraCurrentY) * smoothness;
            instance.cameraCurrentZ += (targetDollyZ - instance.cameraCurrentZ) * smoothness; // 4. Set the camera to the new smoothed position

            instance.camera.position.set(
                instance.cameraCurrentX,
                instance.cameraCurrentY,
                instance.cameraCurrentZ,
            ); // 5. Update spotlight based on the *smoothed* camera position
            instance.spotLight.position.y = instance.cameraCurrentY + 900;
            instance.spotLight.target.position.set(0, instance.cameraCurrentY + 500, -1000);

            // --- HIDE/SHOW SCROLL ARROW ---
            if (instance.scrollArrow) {
                if (p > 0.01) {
                    // If scrolled even a little
                    instance.scrollArrow.classList.add("is-hidden");
                    instance.scrollArrow.classList.remove("is-visible");
                } else {
                    instance.scrollArrow.classList.remove("is-hidden");
                    instance.scrollArrow.classList.add("is-visible");
                }
            }

            // --- SHOW FROG AT BOTTOM ---
            if (instance.frogLink) {
                if (p > 0.98) {
                    // If almost at the bottom (98%)
                    instance.frogLink.classList.add("is-visible");
                    instance.frogLink.classList.remove("is-hidden");
                } else {
                    instance.frogLink.classList.add("is-hidden");
                    instance.frogLink.classList.remove("is-visible");
                }
            }

            // This tells Three.js to draw a new frame with the updated camera
            if (instance.renderer && instance.scene && instance.camera) {
                instance.renderer.render(instance.scene, instance.camera);
            }

            // twinkle & dance
            if (instance.fireflies) {
                var tF = Date.now() * 0.0025; // Time for opacity twinkle
                var tD = Date.now() * 0.001;  // Time for dance movement

                var vertices = instance.fireflies.geometry.vertices;
                var basePositions = instance.fireflies.geometry.basePositions;
                var danceData = instance.fireflies.geometry.danceData;

                // Animate each firefly vertex
                for (var i = 0; i < vertices.length; i++) {
                    var v = vertices[i];
                    var vBase = basePositions[i];
                    var vData = danceData[i];
                    
                    var danceAmount = 15; // How far they dance (in units)

                    v.x = vBase.x + Math.sin(tD * vData.speed + vData.phaseX) * danceAmount;
                    v.y = vBase.y + Math.cos(tD * vData.speed + vData.phaseY) * danceAmount;
                    v.z = vBase.z + Math.sin(tD * vData.speed + vData.phaseZ) * (danceAmount * 0.5);
                }
                
                // Tell Three.js to update the vertex buffer
                instance.fireflies.geometry.verticesNeedUpdate = true;

                // Twinkle opacity
                instance.fireflies.material.opacity = 0.85 + 0.15 * Math.sin(tF);
            }

            // --- Star Twinkle ---
            if (instance.stars && instance.stars.length > 0) {
                var tS_base = Date.now() * 0.0008; // Base time for stars
                // Loop through each star particle system

                for (var i = 0; i < instance.stars.length; i++) {
                    var starSystem = instance.stars[i]; // Give each layer a slightly different twinkle speed/offset
                    var tS = tS_base * (1.0 + i * 0.1);
                    starSystem.material.opacity = 0.85 + 0.15 * Math.sin(tS + i);
                }
            }

            // --- Animate Critters ---
            if (critterSystems && critterSystems.length > 0) {
                var tD = Date.now() * 0.001; // Dance time
                // --- 1. Animate Plankton (index 0) ---

                var plankton = critterSystems[0];
                var vertices = plankton.geometry.vertices;
                var basePositions = plankton.geometry.basePositions;
                var danceData = plankton.geometry.danceData;

                for (var i = 0; i < vertices.length; i++) {
                    var v = vertices[i];
                    var vBase = basePositions[i];
                    var vData = danceData[i];
                    var danceAmount = 10; // Plankton dance amount

                    v.x = vBase.x + Math.sin(tD * vData.speed + vData.phaseX) * danceAmount;
                    v.y = vBase.y + Math.cos(tD * vData.speed + vData.phaseY) * danceAmount;
                }
                plankton.geometry.verticesNeedUpdate = true; // --- 2. Animate Crabs (index 1) ---
                var crabs = critterSystems[1]; // Make them "blink" or "shimmer"
                crabs.material.opacity = 0.7 + 0.3 * Math.sin(tD * 3.0);
            }

            // birds
            if (instance.birds) {
                var tB = Date.now() * 0.01; // Use a slightly different time scale for flapping
                var tBob = Date.now() * 0.003; // Original time for bobbing
                for (var i = 0; i < instance.birds.length; i++) {
                    var b = instance.birds[i], u = b.userData;
                    
                    // --- BIRD MOVEMENT (Unchanged) ---
                    b.position.x += u.dir * u.speed * 0.16;
                    b.position.y += Math.sin(tBob + u.phase) * (u.amp * 0.05); // Bobbing
                    if (b.position.x > 9500 || b.position.x < -9500) {
                        u.dir *= -1;
                        b.rotation.y = (u.dir > 0 ? 0 : Math.PI);
                    }

                    // --- NEW FLAPPING ANIMATION ---
                    // Calculate flap angle (a sine wave)
                    var flapAngle = Math.sin(tB * u.flapSpeed + u.flapPhase) * 0.7; // 0.7 radians (about 40 degrees)
                    
                    // Apply rotation to the wings
                    u.wings[0].rotation.z = flapAngle; // Left wing
                    u.wings[1].rotation.z = -flapAngle; // Right wing
                }
            }

            // console.log('deck scrollHeight', deckEl?.scrollHeight, 'max', __maxScroll);
            // console.log('p', p.toFixed(3), '__maxScroll', __maxScroll);
        };
        
        instance.resize = function () {
            if (instance.renderer) {
                const w = window.innerWidth, h = window.innerHeight;
                setRendererDPR(instance.renderer, Math.min(1.5, window.devicePixelRatio || 1), w, h);
                instance.camera = new THREE.PerspectiveCamera(35, w / h, 2, 10000);
                instance.camera.position.set(0, 850, 2000 );
                instance.camera.rotation.set(0 * Math.PI / 180, 0, 0);
                instance.renderer.render(instance.scene, instance.camera );
            }
            console.log(getScrollPercentDeck());
        };
        
        }

        __bg = new Background();

        function render(){
            if (__bg) __bg.render();
        }

        // DO NOT auto-start here; we’ll call startWaterfallLoop() on switch
        window.addEventListener('resize', () => {
            if (document.body.classList.contains('mode-waterfall')) {
                document.documentElement.style.height = 'auto';
                document.body.style.height = 'auto';
                document.documentElement.style.overflow = 'auto';
                document.body.style.overflow = 'auto';
            }
            __bg && __bg.resize();
        });

    }

    // start the RAF once Scene C is visible
    function startWaterfallLoop() {
        function tick() {
            if (__bg) __bg.render();
                __waterfallRAF = requestAnimationFrame(tick);
            }
        if (!__waterfallRAF) tick();
    }

    // (optional) stop if you ever navigate away from Scene C
    function stopWaterfallLoop() {
        if (__waterfallRAF){ cancelAnimationFrame(__waterfallRAF); __waterfallRAF = null; }
    }

</script>
