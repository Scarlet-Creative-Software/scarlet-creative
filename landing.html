<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scarlet Creative - 3D Earth</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: radial-gradient(circle at 50% 20%, #111 0%, #000 55%, #000 100%);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      /* Fullscreen WebGL canvas */
      #earth-canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        outline: none;
        border: none;
      }

      /* Optional UI overlay, centered title */
      .overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 3rem;
        z-index: 10;
      }

      .overlay-title {
        color: #f5f5f5;
        text-shadow: 0 0 16px rgba(0, 0, 0, 0.8);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        font-size: clamp(0.75rem, 1.5vw, 1rem);
        opacity: 0.85;
      }

      /* Subtle horizon glow */
      .horizon-glow {
        position: fixed;
        left: 0;
        right: 0;
        bottom: -20vh;
        height: 40vh;
        background: radial-gradient(
          ellipse at 50% 0%,
          rgba(255, 143, 59, 0.8) 0%,
          rgba(255, 143, 59, 0.25) 20%,
          rgba(255, 143, 59, 0.05) 40%,
          transparent 70%
        );
        mix-blend-mode: screen;
        opacity: 0.4;
        pointer-events: none;
        filter: blur(4px);
      }

      @media (prefers-reduced-motion: reduce) {
        body[data-reduced-motion="true"] #earth-canvas {
          animation: none !important;
        }
      }
    </style>
  </head>

  <body>
    <!-- WebGL canvas -->
    <canvas id="earth-canvas"></canvas>

    <!-- Optional UI overlay -->
    <div class="overlay">
      <div class="overlay-title">Scarlet Creative</div>
    </div>

    <!-- Horizon glow -->
    <div class="horizon-glow"></div>

    <!-- ✨ Single module script, no globals needed -->
    <script type="module">
      import * as THREE from "https://unpkg.com/three@0.161.0/build/three.module.js";

      // ---------- BASIC SETUP ----------
      const canvas = document.getElementById("earth-canvas");

      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      renderer.setSize(window.innerWidth, window.innerHeight, false);

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x000000, 0.18);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );
      camera.position.set(0, 0, 4);

      // ---------- LIGHTS ----------
      const ambientLight = new THREE.AmbientLight(0x222233, 1.2);
      scene.add(ambientLight);

      const sunLight = new THREE.DirectionalLight(0xfff0d0, 2.2);
      sunLight.position.set(-4, -2, 3);
      scene.add(sunLight);

      // ---------- EARTH ----------
      const earthGroup = new THREE.Group();
      scene.add(earthGroup);

      const earthGeometry = new THREE.SphereGeometry(1, 48, 32);
      const loader = new THREE.TextureLoader();

      const earthTexture = loader.load(
        "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
      );
      const earthNormal = loader.load(
        "https://threejs.org/examples/textures/planets/earth_normal_2048.jpg"
      );
      const earthSpecular = loader.load(
        "https://threejs.org/examples/textures/planets/earth_specular_2048.jpg"
      );

      const earthMaterial = new THREE.MeshPhongMaterial({
        map: earthTexture,
        normalMap: earthNormal,
        specularMap: earthSpecular,
        specular: new THREE.Color(0x444444),
        shininess: 18,
      });

      const earthMesh = new THREE.Mesh(earthGeometry, earthMaterial);
      earthMesh.rotation.z = THREE.MathUtils.degToRad(23.4);
      earthGroup.add(earthMesh);

      const atmosphereGeometry = new THREE.SphereGeometry(1.03, 48, 32);
      const atmosphereMaterial = new THREE.MeshBasicMaterial({
        color: 0x4da6ff,
        transparent: true,
        opacity: 0.18,
        side: THREE.BackSide,
      });
      const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
      earthGroup.add(atmosphere);

      // ---------- STARS ----------
      const starsGeometry = new THREE.BufferGeometry();
      const starCount = 1200;
      const starPositions = new Float32Array(starCount * 3);

      for (let i = 0; i < starCount; i++) {
        const r = 40 + Math.random() * 30;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);

        starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        starPositions[i * 3 + 2] = r * Math.cos(phi);
      }

      starsGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(starPositions, 3)
      );

      const starsMaterial = new THREE.PointsMaterial({
        size: 0.05,
        transparent: true,
        opacity: 0.85,
      });

      const stars = new THREE.Points(starsGeometry, starsMaterial);
      scene.add(stars);

      // ---------- ANIMATION LOOP ----------
      let startTime = performance.now();

      function animate(now) {
        requestAnimationFrame(animate);

        const elapsed = (now - startTime) / 1000; // seconds

        // Earth rotation
        earthMesh.rotation.y += 0.0015;
        earthGroup.rotation.y += 0.0004;

        // "Sunrise" – move light slowly in an arc
        const period = 60; // seconds for a full cycle
        const t = (elapsed % period) / period; // 0..1
        const angle = t * Math.PI; // 0..PI, from left-below to right-below

        const radius = 6;
        sunLight.position.set(
          Math.cos(angle) * radius - 2, // x
          Math.sin(angle) * 2 - 1, // y
          3 // z
        );

        renderer.render(scene, camera);
      }

      requestAnimationFrame(animate);

      // ---------- RESIZE ----------
      function onResize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h, false);
      }

      window.addEventListener("resize", onResize);

      // ---------- PREFERS REDUCED MOTION ----------
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.body.dataset.reducedMotion = "true";
      }
    </script>
  </body>
</html>
